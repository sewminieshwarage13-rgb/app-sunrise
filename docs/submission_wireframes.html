<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunrise Dental Clinic - Wireframes</title>
  <style>
    :root { --ink: #000; --paper: #fff; --shade: #e9e9e9; --mid: #a8a8a8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d8d8d8; color: var(--ink); font-family: Arial, sans-serif; }
    .sheet { width: 1120px; margin: 26px auto; padding: 28px; background: var(--paper); border: 2px solid var(--ink); }
    h1 { margin: 0; font-size: 23px; letter-spacing: .04em; text-transform: uppercase; }
    .lead { margin: 6px 0 22px; font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    figure { margin: 0; break-inside: avoid; }
    figcaption { margin: 0 0 7px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .screen { height: 338px; overflow: hidden; border: 3px solid var(--ink); background: var(--paper); font-size: 11px; }
    .bar { height: 39px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; background: var(--ink); color: var(--paper); font-weight: 700; }
    .bar span:last-child { font-weight: 400; font-size: 10px; }
    .screen-body { padding: 18px; }
    .login { max-width: 310px; margin: 16px auto; }
    .title-line { height: 15px; width: 60%; margin: 0 0 8px; background: var(--ink); }
    .copy-line { height: 7px; width: 90%; margin: 0 0 4px; background: var(--mid); }
    .copy-line.short { width: 60%; }
    label { display: block; margin: 13px 0 4px; font-weight: 700; }
    .input { height: 28px; border: 2px solid var(--ink); background: var(--paper); }
    .button { display: inline-block; margin-top: 15px; padding: 8px 18px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 700; }
    .note { margin-top: 12px; border: 1px dashed var(--ink); padding: 8px; font-size: 10px; }
    .nav { display: flex; gap: 14px; padding: 10px 13px; border-bottom: 2px solid var(--ink); font-size: 10px; font-weight: 700; }
    .hero { display: flex; gap: 16px; align-items: stretch; }
    .metric { flex: 1; border: 2px solid var(--ink); padding: 12px; }
    .metric b { display: block; margin-top: 9px; font-size: 25px; }
    .section-label { margin: 18px 0 7px; font-weight: 700; text-transform: uppercase; }
    .rows { border: 2px solid var(--ink); }
    .row { display: grid; grid-template-columns: 1.05fr 1.05fr 1fr .7fr; min-height: 27px; border-bottom: 1px solid var(--ink); }
    .row:last-child { border-bottom: 0; }
    .row > div { padding: 7px; border-right: 1px solid var(--ink); }
    .row > div:last-child { border-right: 0; }
    .row.head { min-height: 23px; background: var(--shade); font-size: 9px; font-weight: 700; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { margin: 0 0 10px; }
    .field .input { height: 25px; }
    .select::after { content: 'v'; float: right; padding: 5px 8px; font-weight: 700; }
    .form-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .search-line { display: grid; grid-template-columns: 1fr 100px; gap: 9px; }
    .result { margin-top: 19px; border: 2px solid var(--ink); }
    .result h3 { margin: 0; padding: 9px 11px; border-bottom: 2px solid var(--ink); background: var(--shade); font-size: 12px; }
    .result .details { display: grid; grid-template-columns: 1fr 1fr; padding: 10px 12px; gap: 7px; }
    .key { font-weight: 700; }
    .receipt { width: 77%; margin: 4px auto; border: 2px solid var(--ink); padding: 12px; }
    .receipt h2 { margin: 0 0 10px; font-size: 16px; text-align: center; }
    .receipt .rline { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--mid); }
    .receipt .total { margin-top: 10px; padding-top: 8px; border-top: 2px solid var(--ink); font-size: 13px; font-weight: 700; }
    .receipt .print { text-align: center; }
    .caption { margin: 6px 0 0; font-size: 10px; line-height: 1.35; }
    @media print { body { background: var(--paper); } .sheet { margin: 0; border: 0; } }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>Sunrise Dental Clinic Management System: Interface Wireframes</h1>
    <p class="lead">Monochrome low-fidelity wireframes showing the main staff workflow. They communicate hierarchy and function only; final colours, typography and data are not represented.</p>
    <section class="grid">
      <figure>
        <figcaption>Figure 1. Staff login</figcaption>
        <div class="screen">
          <div class="bar"><span>SUNRISE DENTAL CLINIC</span><span>Staff portal</span></div>
          <div class="screen-body login">
            <div class="title-line"></div><div class="copy-line"></div><div class="copy-line short"></div>
            <label>Username</label><div class="input"></div>
            <label>Password</label><div class="input"></div>
            <div class="button">SIGN IN</div>
            <div class="note">An error message appears here when the credentials are invalid.</div>
          </div>
        </div>
        <p class="caption">The page provides an uncluttered access point for authorised staff and clear feedback when authentication fails.</p>
      </figure>

      <figure>
        <figcaption>Figure 2. Dashboard</figcaption>
        <div class="screen">
          <div class="bar"><span>SUNRISE DENTAL CLINIC</span><span>Staff | Exit</span></div>
          <div class="nav"><span>DASHBOARD</span><span>NEW APPOINTMENT</span><span>SEARCH</span><span>HELP</span></div>
          <div class="screen-body">
            <div class="hero"><div class="metric">TODAY'S APPOINTMENTS<b>02</b></div><div class="metric">TOTAL RECORDS<b>05</b></div><div class="metric">NEXT NUMBER<b>APT-1006</b></div></div>
            <div class="section-label">Upcoming appointments</div>
            <div class="rows"><div class="row head"><div>REFERENCE</div><div>PATIENT</div><div>DENTIST</div><div>TIME</div></div><div class="row"><div>APT-1006</div><div>Patient name</div><div>Dentist</div><div>09:00</div></div><div class="row"><div>APT-1007</div><div>Patient name</div><div>Dentist</div><div>10:30</div></div></div>
          </div>
        </div>
        <p class="caption">Key workload indicators and the next appointment number are visible before staff begin a task.</p>
      </figure>

      <figure>
        <figcaption>Figure 3. New appointment</figcaption>
        <div class="screen">
          <div class="bar"><span>SUNRISE DENTAL CLINIC</span><span>Staff | Exit</span></div>
          <div class="nav"><span>DASHBOARD</span><span>NEW APPOINTMENT</span><span>SEARCH</span><span>HELP</span></div>
          <div class="screen-body">
            <div class="title-line"></div>
            <div class="two-col"><div><div class="field"><label>Appointment number</label><div class="input"></div></div><div class="field"><label>Patient name</label><div class="input"></div></div><div class="field"><label>Contact number</label><div class="input"></div></div></div><div><div class="field"><label>Dentist</label><div class="input select"></div></div><div class="field"><label>Treatment</label><div class="input select"></div></div><div class="field"><label>Visit method</label><div style="display:flex;gap:12px;font-weight:700;"><span>&#9673; PHYSICAL</span><span>&#9675; ONLINE</span></div></div><div class="field"><label>Date and time</label><div class="input"></div></div></div></div>
            <div class="form-foot"><span>Required fields and validation messages are shown next to the related input.</span><div class="button">SAVE APPOINTMENT</div></div>
          </div>
        </div>
        <p class="caption">The form groups patient details and appointment details, exposes controlled dentist and treatment choices, and records whether the consultation is physical or online.</p>
      </figure>

      <figure>
        <figcaption>Figure 4. Appointment search</figcaption>
        <div class="screen">
          <div class="bar"><span>SUNRISE DENTAL CLINIC</span><span>Staff | Exit</span></div>
          <div class="nav"><span>DASHBOARD</span><span>NEW APPOINTMENT</span><span>SEARCH</span><span>HELP</span></div>
          <div class="screen-body">
            <div class="title-line"></div><div class="copy-line short"></div>
            <label>Appointment number</label><div class="search-line"><div class="input"></div><div class="button" style="margin:0; text-align:center; padding:6px;">SEARCH</div></div>
            <div class="result"><h3>APPOINTMENT RECORD</h3><div class="details"><div><span class="key">Patient:</span> Patient name</div><div><span class="key">Contact:</span> 0771234567</div><div><span class="key">Dentist:</span> Dentist name</div><div><span class="key">Treatment:</span> Teeth Cleaning</div><div><span class="key">Date:</span> 20 Aug 2026</div><div><span class="key">Time:</span> 11:15</div></div></div>
          </div>
        </div>
        <p class="caption">A direct number lookup limits the result to one complete appointment record and supports the billing workflow.</p>
      </figure>

      <figure>
        <figcaption>Figure 5. Bill and printable receipt</figcaption>
        <div class="screen">
          <div class="bar"><span>SUNRISE DENTAL CLINIC</span><span>Staff | Exit</span></div>
          <div class="screen-body"><div class="receipt"><h2>SUNRISE DENTAL CLINIC<br>PAYMENT RECEIPT</h2><div class="rline"><span>Appointment number</span><span>APT-1001</span></div><div class="rline"><span>Patient</span><span>Patient name</span></div><div class="rline"><span>Consultation</span><span>LKR 1,500.00</span></div><div class="rline"><span>Treatment</span><span>LKR 6,000.00</span></div><div class="rline total"><span>TOTAL</span><span>LKR 7,500.00</span></div><div class="print"><span class="button">PRINT RECEIPT</span></div></div></div>
        </div>
        <p class="caption">The receipt separates the consultation fee and treatment fee, displays the total, and provides a print action.</p>
      </figure>
    </section>
  </main>
</body>
</html>
